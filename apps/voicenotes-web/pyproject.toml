[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicenotes"
version = "0.1.0"
description = "Secure browser transcription and voice notes service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
  "pydantic>=2.8",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "boto3>=1.34",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["voicenotes_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
